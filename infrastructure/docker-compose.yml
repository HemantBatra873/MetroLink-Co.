# MetroLink Co. local infrastructure
# One PostgreSQL instance with four service-owned logical databases.
# Keycloak for authentication. Backend APIs run via Visual Studio / dotnet (not containerized).

services:
  postgres:
    image: postgres:16-alpine
    container_name: metrolink-postgres
    ports:
      # Host 15432 avoids conflict with a local Windows PostgreSQL often bound to 5432.
      # Inside the container the server still listens on 5432.
      - "15432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metrolink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metrolink_dev}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - metrolink_pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metrolink} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: metrolink-keycloak
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  metrolink_pgdata:
